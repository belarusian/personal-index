name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 personal_index/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 personal_index/ tests/ --count --exit-zero --max-complexity=10 --statistics

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy personal_index/ --ignore-missing-imports || true

      - name: Run tests with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov=personal_index --cov-report=term-missing

      - name: Check code coverage
        run: |
          pytest tests/ --cov=personal_index --cov-report=term-missing --cov-fail-under=70

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
