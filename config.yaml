crawler:
  follow_redirects: true
  max_depth: 5
  max_pages_per_domain: 100
  max_redirects: 5
  politeness_delay: 1.0
  rate_limit: 10
  respect_robots_txt: true
  timeout: 30
  user_agent: personal-index/0.1.0
data_dir: .personal_index
export:
  default_format: markdown
  include_scores: true
  include_tags: true
  max_items: 1000
  output_dir: exports
index:
  enable_fuzzy_search: true
  enable_stemming: true
  fuzzy_threshold: 0.8
  index_path: .personal_index
  max_index_size: 100000
  min_term_length: 2
interests: []
log_level: INFO
notifications:
  digest_interval_hours: 24
  email: ''
  enabled: false
  min_score: 0.5
  webhook_url: ''
pipeline:
  enabled: true
  min_content_length: 100
  min_score_threshold: 0.0
  steps:
  - enabled: true
    name: crawl
  - enabled: true
    name: extract
  - enabled: true
    name: filter
  - enabled: true
    name: score
  - enabled: true
    name: tag
  - enabled: true
    name: index
scheduler:
  enabled: false
  interval_hours: 48
  max_concurrent_jobs: 3
  retry_count: 3
  retry_delay_seconds: 60
