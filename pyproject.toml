[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-index"
version = "0.1.0"
description = "A personal web search engine that scans, filters, and indexes the web based on your interests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "schedule>=1.2.0",
    "whoosh>=2.7.4",
    "pyyaml>=6.0",
]

[project.scripts]
personal-index = "personal_index.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["personal_index*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Ignore missing stubs for external libraries
[[tool.mypy.overrides]]
module = [
    "defusedxml.*",
    "requests.*",
    "yaml.*",
    "bs4.*",
    "whoosh.*",
    "schedule.*",
]
ignore_missing_imports = true
