[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "personal-index"
version = "0.1.0"
description = "A personal web search engine that scans, filters, and indexes the web based on your interests"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.19.0",
    "schedule>=1.2.0",
    "click>=8.1.0",
    "rich>=13.6.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
personal-index = "personal_index.cli:main"
