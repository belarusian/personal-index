# Personal Index Configuration
# Copy this file to config.yaml and customize for your needs.

# Directory where indexed data is stored
data_dir: .personal_index

# Crawler settings
crawler:
  max_depth: 5              # Maximum crawl depth
  politeness_delay: 1.0     # Delay between requests (seconds)
  rate_limit: 10            # Maximum concurrent requests
  respect_robots_txt: true  # Respect robots.txt rules
  timeout: 30               # Request timeout (seconds)
  user_agent: "personal-index/0.1.0"
  max_pages_per_domain: 100 # Max pages per domain
  follow_redirects: true    # Follow HTTP redirects
  max_redirects: 5          # Maximum redirect chain length

# Search index settings
index:
  enable_stemming: true     # Enable word stemming
  index_path: .personal_index
  min_term_length: 2        # Minimum term length to index
  max_index_size: 100000    # Maximum number of indexed items
  enable_fuzzy_search: true # Enable fuzzy matching
  fuzzy_threshold: 0.8      # Fuzzy match similarity threshold


# Pipeline settings
pipeline:
  enabled: true
  steps:
    - name: crawl
      enabled: true
    - name: extract
      enabled: true
    - name: filter
      enabled: true
    - name: score
      enabled: true
    - name: tag
      enabled: true
    - name: index
      enabled: true
  min_score_threshold: 0.0
  min_content_length: 100

# Scheduler settings
scheduler:
  enabled: false            # Enable automatic scheduling
  interval_hours: 24        # How often to run scheduled jobs
  max_concurrent_jobs: 3    # Max concurrent scheduled jobs
  retry_count: 3            # Retry failed jobs this many times
  retry_delay_seconds: 60   # Delay between retries

# Notification settings
notifications:
  enabled: false            # Enable notifications
  email: ""                 # Email for notifications
  webhook_url: ""           # Webhook URL for notifications
  min_score: 0.5            # Minimum score to trigger notification
  digest_interval_hours: 24 # Digest email interval

# Export settings
export:
  default_format: markdown  # Default export format (markdown/csv/json)
  output_dir: exports       # Directory for exported files
  include_scores: true      # Include relevance scores in exports
  include_tags: true        # Include tags in exports
  max_items: 1000           # Maximum items to export

# Tracked interests (can also be managed via CLI)
interests: []
# Example:
# interests:
#   - name: "Python"
#     keywords: ["python", "programming"]
#     url_patterns: ["https://python.org/*"]
#     priority: 8

# Logging
log_level: INFO
